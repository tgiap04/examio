# KMAEdu Frontend - Production Docker Compose
# =============================================================================
# Usage:
#   1. Set build args in .env or pass via --build-arg
#   2. docker compose build && docker compose up -d
# =============================================================================

services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_API_URL: /api/v1
                VITE_MEASUREMENT_ID: ${VITE_MEASUREMENT_ID:-}
                VITE_QUIZ_AES_KEY: ${VITE_QUIZ_AES_KEY:-}
                VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        container_name: kmaedu-frontend
        ports:
            # Loopback only: the host reverse proxy (nginx/Caddy) is the way in. FE_BIND=0.0.0.0 to expose it.
            - '${FE_BIND:-127.0.0.1}:${FE_PORT:-6368}:80'
        restart: unless-stopped
        networks:
            - edge
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:80/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '3'

# Created by the backend compose (kmaedu-be/deploy): bring that stack up first.
networks:
    edge:
        external: true
        name: kmaedu-edge
