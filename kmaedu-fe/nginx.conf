# WebSocket/normal-request aware Connection header. For a plain HTTP/SSE
# request $http_upgrade is empty -> Connection stays empty (keep-alive) instead
# of the hardcoded "upgrade" which confused non-WS upstreams.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Docker's embedded DNS. `resolve` below re-resolves the gateway names every `valid` seconds, so a
# recreated gateway container (new IP) is picked up without restarting nginx. A gateway rollout
# (deploy-service.sh) never reloads nginx: a reload closes idle client keep-alive connections.
resolver 127.0.0.11 valid=5s ipv6=off;

# Two gateway instances (kmaedu-be/deploy/compose/gateway.yml). A down or restarting instance is
# skipped for fail_timeout; `zone` shares that state and the resolved addresses across workers.
# `resolve` in an upstream needs nginx >= 1.27.3 (the FE image is nginx:1.27-alpine).
upstream gw {
    zone gw 64k;
    server kmaedu-gateway-a:3000 max_fails=1 fail_timeout=5s resolve;
    server kmaedu-gateway-b:3000 max_fails=1 fail_timeout=5s resolve;
}

server {
    listen 80;
    server_name _;

    # Real client IP from CF-Connecting-IP, trusted only from Cloudflare ranges.
    include /etc/nginx/cloudflare-real-ip.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Cache static assets aggressively (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static files
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to the gateway (hide real backend URL)
    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://gw/api/;
        # Retry the other instance when one is down or being replaced. Only idempotent methods are
        # retried: `non_idempotent` stays unset, so a POST that may have reached a gateway is never
        # sent twice. Long streams already under way are cut when their gateway stops (clients reconnect).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        # A stopped instance whose address is still cached fails fast and goes to the other one.
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-sent X-Forwarded-For must not reach the
        # gateway, which keys rate limits on the address nginx reports here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE/streaming: never buffer, cache, or gzip — otherwise the proxy
        # holds byte-less streams (e.g. /config/stream heartbeats) and the
        # client hangs "pending" then hits an upstream 524 timeout.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # WebSocket (study room, socket.io). The gateway authenticates the upgrade
    # (cookie accessToken), checks the page flag and rate limit, then proxies it.
    # Real client IP comes from the server-level real_ip include; XFF is overwritten.
    location /ws/ {
        proxy_pass http://gw/ws/;
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived sockets: keep idle connections open for an hour.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://www.google.com https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}
