# Real client IP behind Cloudflare (RT-15). Included by nginx.conf.
#
# nginx trusts CF-Connecting-IP ONLY when the TCP peer is a Cloudflare edge
# address; for any other peer the header is ignored, so a client can neither
# forge its address nor collapse everyone onto a Cloudflare IP (which is what
# every per-IP limit saw before this file existed).
#
# Refresh when Cloudflare publishes new ranges (a few times a year):
#   curl -fsS https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6 \
#     | sed 's/^/set_real_ip_from /; s/$/;/'
# then replace the list below, keep the two directives at the end, and run
#   docker run --rm -v $PWD/examio-fe/nginx.conf:/etc/nginx/templates/default.conf.template \
#     -v $PWD/examio-fe/nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf \
#     -e BACKEND_URL=http://x:3000 nginx:1.27-alpine nginx -t
#
# A host-level proxy or Cloudflare Tunnel in front of nginx is NOT covered:
# add its address as another set_real_ip_from line (see deploy README).
#
# Ranges fetched 2026-10-19 from https://www.cloudflare.com/ips-v4 and /ips-v6.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
