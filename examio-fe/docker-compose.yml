# Examio Frontend - Production Docker Compose
# =============================================================================
# Usage:
#   1. Set build args in .env or pass via --build-arg
#   2. docker compose build && docker compose up -d
# =============================================================================

services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_API_URL: /api/v1
                VITE_MEASUREMENT_ID: ${VITE_MEASUREMENT_ID:-}
                VITE_QUIZ_AES_KEY: ${VITE_QUIZ_AES_KEY:-}
                VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
                VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        container_name: examio-frontend
        environment:
            - BACKEND_URL=${BACKEND_URL:-http://examio-gateway:3000}
        ports:
            - '${FE_PORT:-6368}:80'
        restart: unless-stopped
        networks:
            - examio-network
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:80/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        logging:
            driver: 'json-file'
            options:
                max-size: '5m'
                max-file: '3'

networks:
    examio-network:
        external: true
        name: examio-network
