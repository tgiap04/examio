<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="currentColor" opacity="0.08"/>
  <circle cx="50" cy="50" r="48" stroke="currentColor" stroke-width="3.5" fill="none"/>

  <!-- Middle decorative ring (trống đồng pattern) -->
  <circle cx="50" cy="50" r="36" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <!-- Inner ring -->
  <circle cx="50" cy="50" r="26" stroke="currentColor" stroke-width="2" fill="none"/>

  <!-- Center filled circle -->
  <circle cx="50" cy="50" r="10" fill="currentColor"/>

  <!-- Radiating lines (trống đồng sun motif + graduation cap rays) -->
  <line x1="50" y1="24" x2="50" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="86" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="50" x2="14" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="86" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="32.3" y1="32.3" x2="25.6" y2="25.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="67.7" y1="67.7" x2="74.4" y2="74.4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="67.7" y1="32.3" x2="74.4" y2="25.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32.3" y1="67.7" x2="25.6" y2="74.4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
