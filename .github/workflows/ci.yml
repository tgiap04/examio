name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Contract source of truth: lint always, breaking-change check against the PR base.
  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.74.0
          input: examio-be/proto
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=examio-be/proto
          push: false
          archive: false
          comment: true

  # Typecheck + compile every Node service. `yarn build` alone only builds the
  # default project, so each service is built explicitly.
  be-check:
    name: be-check (${{ matrix.svc }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examio-be
    strategy:
      fail-fast: false
      matrix:
        svc: [auth, exam, finance, admin, r2, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: examio-be/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - name: Prisma schema is in sync with models
        run: |
          yarn prisma:merge
          git diff --exit-code -- libs/database/src/schema.prisma
      - run: yarn proto:gen
      - run: yarn prisma:generate
      - run: yarn typecheck:${{ matrix.svc }}
      - run: yarn nest build ${{ matrix.svc }}-service

  # Boots every built service from dist (not ts-jest) against real infra, so
  # runtime-only failures (missing proto assets, DI/client wiring) fail CI.
  be-boot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examio-be
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: examio
          POSTGRES_PASSWORD: examio
          POSTGRES_DB: examio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examio -d examio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://examio:examio@localhost:5432/examio_ci
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      REFRESH_TOKEN_ENC_KEY: ci-only-refresh-key-0123456789abcdef0123456789
      FRONTEND_URL: http://localhost:5173
      JWT_ISSUER: examio-auth
      JWT_AUDIENCE: examio
      AUTH_JWKS_URL: http://localhost:3000/.well-known/jwks.json
      AUTH_TOKEN_URL: http://localhost:3000/internal/token
      AUTH_GRPC_URL: localhost:50051
      # JWT_PRIVATE_KEY / JWT_KID / SERVICE_CLIENTS / SERVICE_CLIENT_SECRET are
      # generated per job below (ephemeral; nothing key-like is committed).
      # Boot-time required config; inert placeholders (nothing calls these providers).
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      PAYMENT_SERVICE_SEPAY_KEY: ci-dummy
      PAYMENT_QR_BANK_ACCOUNT: ci-dummy
      PAYMENT_QR_BANK_CODE: ci-dummy
      QUIZ_JWT_SECRET: ci-dummy-quiz-jwt-secret-0123456789abcdef
      QUIZ_AES_KEY: ci-dummy-quiz-aes-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: examio-be/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prisma:generate
      - run: yarn build:all
      - name: Ephemeral JWT key and service clients
        run: |
          ./scripts/ci-ephemeral-auth-env.sh > "$RUNNER_TEMP/auth-env.txt"
          grep '^::add-mask::' "$RUNNER_TEMP/auth-env.txt"
          grep -v '^::' "$RUNNER_TEMP/auth-env.txt" >> "$GITHUB_ENV"
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy --schema=libs/database/src/schema.prisma
      - name: Boot each built service from dist and probe /health/live
        run: ./scripts/boot-built-services.sh
      # The compose file turns on GATEWAY_CONTROL_ENABLED and the api+worker roles;
      # those paths load protos/clients a flag-off boot never touches.
      - name: Boot each built service again with the docker-compose default feature flags
        run: COMPOSE_DEFAULTS=1 ./scripts/boot-built-services.sh

  be-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examio-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: examio-be/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn proto:gen
      - run: yarn prisma:generate
      - run: yarn test --ci
      - name: RabbitMQ definitions renderer
        run: node --test deploy/rabbitmq/render-definitions.spec.cjs
      - name: Compose topology (no data-store host ports, edge/internal/egress split)
        run: node --test deploy/compose-topology.spec.cjs

  # Boots every service module against empty pgvector Postgres + Redis +
  # RabbitMQ (migrations applied from the committed baseline) and probes
  # /health/live and /health/ready.
  be-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examio-be
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: examio
          POSTGRES_PASSWORD: examio
          POSTGRES_DB: examio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examio -d examio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://examio:examio@localhost:5432/examio_ci
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # CI-only broker credentials (the broker runs from the rendered
      # definitions, so there is no guest user): one per service.
      RABBITMQ_USER: ci_admin
      RABBITMQ_PASS: ci-only-admin-pass
      RABBITMQ_AUTH_PASS: ci-only-auth-pass
      RABBITMQ_FINANCE_PASS: ci-only-finance-pass
      RABBITMQ_EXAM_PASS: ci-only-exam-pass
      RABBITMQ_AI_PASS: ci-only-ai-pass
      RABBITMQ_GATEWAY_PASS: ci-only-gateway-pass
      REFRESH_TOKEN_ENC_KEY: ci-only-refresh-key-0123456789abcdef0123456789
      FRONTEND_URL: http://localhost:5173
      JWT_ISSUER: examio-auth
      JWT_AUDIENCE: examio
      AUTH_JWKS_URL: http://localhost:3000/.well-known/jwks.json
      AUTH_TOKEN_URL: http://localhost:3000/internal/token
      AUTH_GRPC_URL: localhost:50051
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: examio-be/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn proto:gen
      - run: yarn prisma:generate
      - name: Ephemeral JWT key and service clients
        run: |
          ./scripts/ci-ephemeral-auth-env.sh > "$RUNNER_TEMP/auth-env.txt"
          grep '^::add-mask::' "$RUNNER_TEMP/auth-env.txt"
          grep -v '^::' "$RUNNER_TEMP/auth-env.txt" >> "$GITHUB_ENV"
      - name: RabbitMQ with the rendered per-service users and topic permissions
        run: |
          node deploy/rabbitmq/render-definitions.cjs --out "$PWD/deploy/rabbitmq/definitions.json"
          docker run -d --name rabbitmq -p 5672:5672 \
            -v "$PWD/deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro" \
            -v "$PWD/deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro" \
            rabbitmq:3.13
          for i in $(seq 1 30); do
            docker exec rabbitmq rabbitmq-diagnostics -q ping && break
            sleep 2
          done
          docker exec rabbitmq rabbitmq-diagnostics -q ping
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy --schema=libs/database/src/schema.prisma
      - name: Migrations cover the whole schema (no drift)
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel libs/database/src/schema.prisma
          --exit-code
      - name: Service health e2e
        run: |
          # exam's health e2e runs with the whole exam e2e folder in the RBAC step below
          for svc in auth finance admin r2 gateway; do
            echo "::group::$svc-service e2e"
            # Services without a broker user of their own boot with auth's.
            case "$svc" in auth|exam|finance|gateway) user=$svc ;; *) user=auth ;; esac
            pass_var="RABBITMQ_$(echo "$user" | tr a-z A-Z)_PASS"
            export RABBITMQ_URL="amqp://$user:${!pass_var}@localhost:5672"
            # exam's legacy event subscriber declares a queue named SERVICE_NAME,
            # which is the only non-prefixed queue the exam broker user may touch.
            export SERVICE_NAME="$svc-service"
            (cd apps/$svc-service && ../../node_modules/.bin/jest --config test/jest-e2e.json --testPathPatterns app.e2e-spec)
            echo "::endgroup::"
          done
      - name: Messaging e2e (outbox relay, idempotent consumer, broker permissions, purge)
        run: |
          export RABBITMQ_AUTH_URL="amqp://auth:$RABBITMQ_AUTH_PASS@localhost:5672"
          (cd apps/auth-service && RABBITMQ_URL="$RABBITMQ_AUTH_URL" ../../node_modules/.bin/jest --config test/jest-e2e.json test/register-outbox.e2e-spec.ts)
          (cd libs/messaging && ../../node_modules/.bin/jest --config test/jest-e2e.json)
      - name: Identity and RBAC e2e (tokens, service tokens, role change, gRPC guards, teacher wallet, admin)
        run: |
          export RABBITMQ_AUTH_URL="amqp://auth:$RABBITMQ_AUTH_PASS@localhost:5672"
          export SERVICE_NAME="auth-service"
          (cd apps/auth-service && RABBITMQ_URL="$RABBITMQ_AUTH_URL" ../../node_modules/.bin/jest --config test/jest-e2e.json test/token.e2e-spec.ts test/service-token.e2e-spec.ts test/role-change.e2e-spec.ts test/public-profiles.e2e-spec.ts test/login-throttle.e2e-spec.ts)
          (cd apps/finance-service && RABBITMQ_URL="amqp://finance:$RABBITMQ_FINANCE_PASS@localhost:5672" ../../node_modules/.bin/jest --config test/jest-e2e.json test/user-authz-changed.e2e-spec.ts)
          (cd apps/admin-service && RABBITMQ_URL="$RABBITMQ_AUTH_URL" ../../node_modules/.bin/jest --config test/jest-e2e.json test/admin.e2e-spec.ts test/admin-roles.e2e-spec.ts test/ban.e2e-spec.ts)
      - name: RBAC enforcement e2e (whole exam folder in one process, plus auth device ownership)
        run: |
          export RABBITMQ_AUTH_URL="amqp://auth:$RABBITMQ_AUTH_PASS@localhost:5672"
          # The WHOLE exam e2e folder (health, ownership, validation, ws) in ONE jest process;
          # jest-e2e.json maxWorkers 1 because the WebSocket spec consumes exam.events.
          # RABBITMQ_AUTH_URL (exported above) is used by the ws spec to publish authz_changed.
          (cd apps/exam-service && RABBITMQ_URL="amqp://exam:$RABBITMQ_EXAM_PASS@localhost:5672" SERVICE_NAME=exam-service ../../node_modules/.bin/jest --config test/jest-e2e.json)
          (cd apps/auth-service && RABBITMQ_URL="$RABBITMQ_AUTH_URL" SERVICE_NAME=auth-service ../../node_modules/.bin/jest --config test/jest-e2e.json test/ownership)
      - name: Gateway e2e (streaming proxy, revoke/av incl. durable path, rate limits, CORS, WS upgrade, Lua scripts)
        run: |
          export RABBITMQ_AUTH_URL="amqp://auth:$RABBITMQ_AUTH_PASS@localhost:5672"
          export RABBITMQ_URL="amqp://gateway:$RABBITMQ_GATEWAY_PASS@localhost:5672"
          (cd apps/gateway-service && ../../node_modules/.bin/jest --config test/jest-e2e.json \
            test/gateway.e2e-spec.ts test/gateway-streaming.e2e-spec.ts test/gateway-expect.e2e-spec.ts test/gateway-authz.e2e-spec.ts test/gateway-control.e2e-spec.ts test/gateway-edge.e2e-spec.ts test/redis-scripts.e2e-spec.ts)
          # Real auth + real gateway + outbox relay: cookies, logout revoke, role-change staleness (fast + durable)
          export RABBITMQ_URL="$RABBITMQ_AUTH_URL"
          export RABBITMQ_GATEWAY_URL="amqp://gateway:$RABBITMQ_GATEWAY_PASS@localhost:5672"
          (cd apps/auth-service && SERVICE_NAME=auth-service ../../node_modules/.bin/jest --config test/jest-e2e.json test/gateway-integration.e2e-spec.ts)

  # Deploy configuration that only fails at `up` time: the compose file must
  # render, and nginx must accept the real-ip include. Dummy values only.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config renders (dummy env)
        working-directory: examio-be/deploy
        run: |
          for v in FRONTEND_URL DATABASE_URL REDIS_PASSWORD JWT_PRIVATE_KEY JWT_KID SERVICE_CLIENTS \
            RABBITMQ_USER RABBITMQ_PASS RABBITMQ_AUTH_PASS RABBITMQ_FINANCE_PASS RABBITMQ_EXAM_PASS \
            RABBITMQ_AI_PASS RABBITMQ_GATEWAY_PASS EXAM_SERVICE_CLIENT_SECRET FINANCE_SERVICE_CLIENT_SECRET \
            ADMIN_SERVICE_CLIENT_SECRET POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB ADMIN_EMAILS \
            ADMIN_DEFAULT_PASSWORD GEMINI_API_KEYS GEMINI_MODEL_NAMES; do echo "$v=ci-dummy"; done > .env
          docker compose config --quiet
          rm -f .env
      - name: nginx accepts the Cloudflare real-ip include
        run: |
          docker run --rm \
            -v "$PWD/examio-fe/nginx.conf:/etc/nginx/templates/default.conf.template" \
            -v "$PWD/examio-fe/nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf" \
            -e BACKEND_URL=http://127.0.0.1:3000 nginx:1.27-alpine nginx -t

  fe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examio-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: examio-fe/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test

  # The FE Permission union is generated from the backend catalog: fail on drift.
  fe-permissions-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examio-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: examio-be/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn gen:fe-permissions
      # Fail if the file is missing or untracked (a bare `git diff` is vacuous
      # for untracked files), then fail on any drift from the committed copy.
      - name: Check generated file is tracked and unchanged
        run: |
          f=../examio-fe/src/types/permissions.generated.ts
          test -f "$f"
          git ls-files --error-unmatch "$f"
          git diff --exit-code -- "$f"
