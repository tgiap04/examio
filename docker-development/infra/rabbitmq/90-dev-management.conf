# docker-development only. Loaded after deploy's 20-definitions.conf, so these win.
# Definitions rendered by rabbitmq-defs into .generated/rabbitmq (mounted at /etc/rabbitmq/dev-defs).
definitions.local.path = /etc/rabbitmq/dev-defs/definitions.json
# Management UI/API under /_rabbitmq so Traefik routes it without stripping the prefix.
management.path_prefix = /_rabbitmq
