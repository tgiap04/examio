# AI service (Python): schema `ai` (ai_svc), Alembic migrations, gRPC AiService (+ /health only over HTTP) + event worker
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# One image, three roles (ROLE): ai-migrate (alembic upgrade head, one-shot), ai (gRPC :50051 +
# /health), ai-worker (document/generation events + outbox relay).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

# The context is kmaedu-be/ (not apps/ai-service): the build regenerates the gRPC stubs from proto/.
x-ai-image: &ai-image
    image: ghcr.io/tgiap04/kmaedu-ai:${AI_TAG:-main}
    build:
        context: ..
        dockerfile: apps/ai-service/Dockerfile

# ai_svc; no ?schema= (asyncpg would send it as a server setting): the search_path is pinned
# per connection from DB_SEARCH_PATH.
x-ai-database: &ai-database
    DATABASE_URL: postgresql://ai_svc:${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    DB_SEARCH_PATH: ai,extensions

# Secrets and key lists (GEMINI_API_KEYS, GEMINI_MODEL_NAMES, AI2_API_KEY) come from env/ai.env, not from
# compose interpolation; only tunables with defaults are set inline.
x-ai-models: &ai-models
    PYTHONUNBUFFERED: '1'
    AI2_BASE_URL: '${AI2_BASE_URL:-https://ai2.devt.vn/v1}'
    AI2_GENERATION_MODEL_NAMES: '${AI2_GENERATION_MODEL_NAMES:-minimax-m2.5-free,nemotron-3-super-free,trinity-large-preview-free}'
    AI2_DEFAULT_MODEL: '${AI2_DEFAULT_MODEL:-minimax-m2.5-free}'
    AI2_TIMEOUT_SECONDS: '${AI2_TIMEOUT_SECONDS:-3600}'
    AI2_MAX_TOKENS: '${AI2_MAX_TOKENS:-4096}'
    DEFAULT_MAX_TOKENS_CAP: '${DEFAULT_MAX_TOKENS_CAP:-4096}'
    TUTOR_FAST_RETRIEVAL_TIMEOUT_SECONDS: '${TUTOR_FAST_RETRIEVAL_TIMEOUT_SECONDS:-0.5}'
    CHAT_HISTORY_MAX_MESSAGES: '${CHAT_HISTORY_MAX_MESSAGES:-4}'
    CHAT_HISTORY_MAX_CHARS: '${CHAT_HISTORY_MAX_CHARS:-1200}'
    GEMINI_EMBEDDING_MODEL: '${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}'
    OCR_SERVICE_URL: ''  # Using internal Tesseract/PyPDF logic

services:
    # One-shot: `alembic upgrade head` for schema `ai` as ai_svc, then exits.
    ai-migrate:
        <<: *ai-image
        container_name: kmaedu-ai-migrate
        environment:
            <<: *ai-database
            ROLE: migrate
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal
        healthcheck:
            disable: true
        mem_limit: 512m
        restart: 'no'
        logging: *default-logging

    # gRPC AiService (service tokens, caller allow-list) + /health. No host port.
    ai:
        <<: *ai-image
        container_name: kmaedu-ai
        environment:
            <<: [*ai-database, *ai-models]
            ROLE: api
            PORT: '3000'
            GRPC_PORT: '50051'
            # Service-token verification (RS256, aud=ai) against the auth JWKS.
            JWT_ISSUER: ${JWT_ISSUER:-kmaedu-auth}
            AUTH_JWKS_URL: http://auth:3000/.well-known/jwks.json
        env_file:
            - path: env/ai.env
              required: true
        depends_on:
            ai-migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            auth:
                condition: service_healthy
        networks:
            - internal
            - egress
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        stop_grace_period: 30s
        mem_limit: 1536m
        restart: unless-stopped
        logging: *default-logging

    # document.uploaded / document.deleted / content.generation.requested consumer, outbox
    # relay and daily purge. Downloads presigned R2 URLs, so it needs egress.
    ai-worker:
        <<: *ai-image
        container_name: kmaedu-ai-worker
        environment:
            <<: [*ai-database, *ai-models]
            ROLE: worker
            RABBITMQ_URL: amqp://ai:${RABBITMQ_AI_PASS:?RABBITMQ_AI_PASS is required}@rabbitmq:5672
            # Presigned GET URLs point at the R2 S3 endpoint: it must be allow-listed (SSRF guard).
            R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
            R2_ALLOWED_HOSTS: ${R2_ALLOWED_HOSTS:-}
        env_file:
            - path: env/ai.env
              required: true
        depends_on:
            ai-migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - internal
            - egress
        # No HTTP port: the worker touches /tmp/worker-heartbeat every 30 s while its broker connection,
        # outbox relay and purge are alive (src/backend/messaging/heartbeat.py); stale for 2 min = unhealthy.
        healthcheck:
            test: ['CMD-SHELL', 'find /tmp/worker-heartbeat -mmin -2 2>/dev/null | grep -q .']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        stop_grace_period: 30s
        mem_limit: 2g
        restart: unless-stopped
        logging: *default-logging
