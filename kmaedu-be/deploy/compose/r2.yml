# R2 storage service (gRPC; no database)
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    r2:
        image: ghcr.io/tgiap04/kmaedu-r2:${R2_TAG:-main}
        build:
            context: ..
            dockerfile: deploy/Dockerfile.node
            args:
                SERVICE: r2-service
        container_name: kmaedu-r2
        environment:
            - NODE_ENV=production
            - PORT=3000
            - GRPC_PORT=50051
            - JWT_ISSUER=${JWT_ISSUER:-kmaedu-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-kmaedu}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
        env_file:
            - path: env/r2.env
              required: true
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        mem_limit: 384m
        restart: unless-stopped
        logging: *default-logging
