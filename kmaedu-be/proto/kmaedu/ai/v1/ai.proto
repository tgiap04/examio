syntax = "proto3";

package kmaedu.ai.v1;

// Synchronous AI for ai-chat/vocabulary/content. Served by ai-service on
// :50051, guarded by a service token (aud=ai, caller allow-list). Callers have
// already authorized every user_storage_id they pass.
//
// Error mapping (replaces the HTTP statuses of ai-service today): an
// unavailable or misconfigured model -> UNAVAILABLE with the model error code
// (MODEL_UNAVAILABLE | MODEL_INSUFFICIENT_VRAM | MODEL_RUNTIME_ERROR |
// MODEL_CONFIGURATION_ERROR) in the `x-error-code` trailing metadata; bad input
// (unknown model, oversize fields) -> INVALID_ARGUMENT; anything else ->
// INTERNAL with a correlation reference in the message, never raw error text.
service AiService {
  // Server-streaming chat (today's SSE `POST /chat/stream`). Pre-stream failures
  // are gRPC statuses; failures after the stream started are an `error` event.
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatResponse);
  // Non-streaming chat (today's `POST /chat/query`).
  rpc Query(QueryRequest) returns (QueryResponse);
  // Today's `POST /generate/word-family`.
  rpc GenerateWordFamily(GenerateWordFamilyRequest) returns (GenerateWordFamilyResponse);
  // Model catalog with live availability (today's `GET /ai/models`).
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

message ChatMessage {
  // "user" or "assistant" (anything else is treated as assistant).
  string role = 1;
  // At most 8000 chars.
  string content = 2;
}

// Fields are identical for StreamChat and Query (separate messages only so each
// RPC keeps its own request type); limits below are enforced by ai-service.
message StreamChatRequest {
  // At most 8000 chars.
  string query = 1;
  // At most 200 items.
  repeated ChatMessage history = 2;
  // RAG context: the document to retrieve from. Absent = general chat.
  optional string user_storage_id = 3;
  // Accepted for HTTP parity; unused by the retrieval pipeline today.
  optional string department = 4;
  // Model id from the registry; absent = default generation model.
  optional string model_type = 5;
  // Custom system prompt, at most 4000 chars. Honored by StreamChat only
  // (Query ignores it today).
  optional string system_prompt = 6;
}

message QueryRequest {
  // At most 8000 chars.
  string query = 1;
  // At most 200 items.
  repeated ChatMessage history = 2;
  // RAG context: the document to retrieve from. Absent = general chat.
  optional string user_storage_id = 3;
  // Accepted for HTTP parity; unused by the retrieval pipeline today.
  optional string department = 4;
  // Model id from the registry; absent = default generation model.
  optional string model_type = 5;
  // Custom system prompt, at most 4000 chars. Honored by StreamChat only
  // (Query ignores it today).
  optional string system_prompt = 6;
}

// Retrieved passage backing an answer (`HybridRetrievalService._build_sources`).
message ChatSource {
  // First 300 chars of the chunk.
  string content = 1;
  // Page range label, e.g. "3-4"; may be empty.
  string page = 2;
  string title = 3;
  string chunk_id = 4;
}

message QueryResponse {
  string answer = 1;
  repeated ChatSource sources = 2;
  // Unix epoch milliseconds (server time of the answer).
  int64 timestamp = 3;
}

// One stream frame: exactly one of the fields below is set. Order on the wire:
// `started`, zero or more `chunk`, then `done` OR `error` (the same frames as
// the SSE `started` / `chunk` / `done` / `error` events).
message StreamChatResponse {
  oneof event {
    StreamStarted started = 1;
    // Token text to append to the answer.
    string chunk = 2;
    StreamDone done = 3;
    StreamError error = 4;
  }
}

message StreamStarted {}

message StreamDone {
  // The full accumulated answer; `role` is always "assistant".
  ChatMessage assistant_message = 1;
  // Unix epoch milliseconds the answer finished.
  int64 created_at = 2;
  repeated ChatSource sources = 3;
}

message StreamError {
  // Generic text plus a correlation reference; never internal error details.
  string message = 1;
  // Model error code when the failure carries one (e.g. MODEL_RUNTIME_ERROR).
  optional string code = 2;
}

message GenerateWordFamilyRequest {
  string category_slug = 1;
  string category_name = 2;
  // 1..20; ignored when root_word is set.
  int32 num_root_words = 3;
  // Root words already generated (at most 50).
  repeated string exclude_root_words = 4;
  // When set, generate the family of exactly this root word.
  optional string root_word = 5;
  optional string model_type = 6;
}

message WordAffix {
  string prefix = 1;
  string root = 2;
  string suffix = 3;
}

message WordFamilyWord {
  string word = 1;
  // noun | verb | adjective | adverb
  string pos = 2;
  string meaning_en = 3;
  string meaning_vi = 4;
  string example = 5;
  WordAffix affix = 6;
}

// One generated word family (ai-service `WordFamilyData`).
message WordFamilyData {
  string root_word = 1;
  string category_slug = 2;
  repeated WordFamilyWord words = 3;
}

// Success only: a failed generation is a gRPC status (see the service comment),
// not a `success=false` body.
message GenerateWordFamilyResponse {
  WordFamilyData data = 1;
}

message ListModelsRequest {}

message ModelSpec {
  string label = 1;
  string value = 2;
}

message ModelInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  string provider = 4;
  string runtime_model_name = 5;
  string badge = 6;
  bool disabled = 7;
  bool is_default = 8;
  bool supports_structured_output = 9;
  repeated ModelSpec specs = 10;
  bool available = 11;
  // Why the model is unavailable; absent when available.
  optional string availability_reason = 12;
}

message ListModelsResponse {
  ModelInfo embedding_model = 1;
  repeated ModelInfo generation_models = 2;
  string default_generation_model = 3;
}
