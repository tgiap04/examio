# R2 storage service (gRPC; no database)
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    r2:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: r2-service
        container_name: examio-r2
        environment:
            - NODE_ENV=production
            - PORT=3000
            - GRPC_PORT=50051
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
        env_file:
            - .env
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging
