# Dev seed one-shot (needs every database service migrated first).
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    # ==================== SEED ====================
    # Runs the per-service dev seeds once (auth -> finance -> admin -> ai-chat -> vocabulary), each as its own
    # role/schema, and exits. Idempotent — safe to re-run.
    # Opt-in (profile `seed`): a plain `docker compose up` never runs it, so production never
    # gets dev users/passwords and `up --wait` does not trip over a one-shot that exits.
    # Run it with: docker compose --profile seed run --rm seed
    # Picks up ADMIN_DEFAULT_PASSWORD / ADMIN_EMAILS from `deploy/env/auth.env`
    # via env_file so seeded users share the same password as admins
    # created by the auth-service bootstrap.
    seed:
        profiles: ['seed']
        build:
            context: ..
            dockerfile: deploy/Dockerfile.node
            target: seed
            args:
                SERVICE: auth-service
        container_name: examio-seed
        environment:
            - ROLE=seed
            - SEED_PROFILE=dev
            - AUTH_DATABASE_URL=postgresql://auth_svc:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=auth
            - FINANCE_DATABASE_URL=postgresql://finance_svc:${FINANCE_DB_PASSWORD:?FINANCE_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=finance
            - ADMIN_DATABASE_URL=postgresql://admin_svc:${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=admin
            - AICHAT_DATABASE_URL=postgresql://aichat_svc:${AICHAT_DB_PASSWORD:?AICHAT_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=aichat
            - VOCABULARY_DATABASE_URL=postgresql://vocabulary_svc:${VOCABULARY_DB_PASSWORD:?VOCABULARY_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=vocabulary
        env_file:
            - path: env/auth.env
              required: true
        depends_on:
            auth-migrate:
                condition: service_completed_successfully
            finance-migrate:
                condition: service_completed_successfully
            admin-migrate:
                condition: service_completed_successfully
            ai-chat-migrate:
                condition: service_completed_successfully
            vocabulary-migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        networks:
            - internal
        mem_limit: 512m
        restart: 'no'
        logging: *default-logging
