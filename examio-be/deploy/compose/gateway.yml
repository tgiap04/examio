# Gateway (no database: no postgres or migrate dependency)
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    gateway:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: gateway-service
        container_name: examio-gateway
        ports:
            - '127.0.0.1:6369:3000'
        environment:
            - NODE_ENV=production
            - PORT=3000
            - FRONTEND_URL=${FRONTEND_URL}
            - AUTH_SERVICE_URL=http://auth:3000
            - EXAM_SERVICE_URL=http://exam:3000
            - FINANCE_SERVICE_URL=http://finance:3000
            - ADMIN_SERVICE_URL=http://admin:3000
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            # GatewayControl gRPC server (auth/admin -> gateway), internal network only
            - GRPC_PORT=50051
            # Durable `auth.user.authz_changed` consumer (queue gateway.events)
            - RABBITMQ_URL=amqp://gateway:${RABBITMQ_GATEWAY_PASS:?RABBITMQ_GATEWAY_PASS is required}@rabbitmq:5672
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
            # Boot-time pull of the page flags (AdminService.GetPageFlags) when Redis is empty.
            # Needs a `gateway` entry in SERVICE_CLIENTS; the pull stays off while the secret is unset.
            - ADMIN_GRPC_URL=admin:50051
            - AUTH_TOKEN_URL=http://auth:3000/internal/token
            - SERVICE_CLIENT_SECRET=${GATEWAY_SERVICE_CLIENT_SECRET:-}
        env_file:
            - .env
        # The gateway is a router: no database, so no postgres/migration dependency.
        depends_on:
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            auth:
                condition: service_healthy
            exam:
                condition: service_healthy
            finance:
                condition: service_healthy
            admin:
                condition: service_healthy
        networks:
            - edge
            - internal
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging
