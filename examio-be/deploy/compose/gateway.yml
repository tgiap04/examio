# Gateway (no database: no postgres or migrate dependency)
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

# Two identical instances behind the FE nginx upstream `gw` (examio-fe/nginx.conf), so a deploy rolls
# them one at a time (deploy/deploy-service.sh: a, then b; nginx re-resolves the names, no reload). The gateway
# holds no state of its own: revocation, authz versions, page flags and rate limits live in Redis, and
# both instances write them (GatewayControl RPCs, and the durable `gateway.events` consumer, which
# competes on one queue and only writes that same Redis state). Both instances carry the network alias
# `gateway` on `internal`, so auth/admin keep calling `gateway:50051` and reach whichever is up.
# No host port: the only way in is the FE nginx on `edge`.
x-gateway: &gateway
    image: ghcr.io/cychipo/examio-gateway:${GATEWAY_TAG:-main}
    build:
        context: ..
        dockerfile: deploy/Dockerfile.node
        args:
            SERVICE: gateway-service
    environment:
        - NODE_ENV=production
        - PORT=3000
        - FRONTEND_URL=${FRONTEND_URL}
        - AUTH_SERVICE_URL=http://auth:3000
        - CONTENT_SERVICE_URL=http://content:3000
        - ASSESSMENT_SERVICE_URL=http://assessment:3000
        - STUDYROOM_SERVICE_URL=http://study-room:3000
        - VOCABULARY_SERVICE_URL=http://vocabulary:3000
        - DOCUMENT_SERVICE_URL=http://document:3000
        - AICHAT_SERVICE_URL=http://ai-chat:3000
        - ADMIN_SERVICE_URL=http://admin:3000
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - REDIS_PASSWORD=${REDIS_PASSWORD:-}
        # GatewayControl gRPC server (auth/admin -> gateway), internal network only
        - GRPC_PORT=50051
        # Durable `auth.user.authz_changed` consumer (queue gateway.events)
        - RABBITMQ_URL=amqp://gateway:${RABBITMQ_GATEWAY_PASS:?RABBITMQ_GATEWAY_PASS is required}@rabbitmq:5672
        - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
        - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
        - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
        # Boot-time pull of the page flags (AdminService.GetPageFlags) when Redis is empty.
        # Needs a `gateway` entry in SERVICE_CLIENTS; the pull stays off while the secret is unset.
        - ADMIN_GRPC_URL=admin:50051
        - AUTH_TOKEN_URL=http://auth:3000/internal/token
        - SERVICE_CLIENT_SECRET=${GATEWAY_SERVICE_CLIENT_SECRET:-}
    env_file:
        - path: env/gateway.env
          required: true
    # The gateway is a router: no database, so no postgres/migration dependency.
    depends_on:
        redis:
            condition: service_healthy
        rabbitmq:
            condition: service_healthy
        auth:
            condition: service_healthy
        content:
            condition: service_healthy
        assessment:
            condition: service_healthy
        study-room:
            condition: service_healthy
        vocabulary:
            condition: service_healthy
        document:
            condition: service_healthy
        ai-chat:
            condition: service_healthy
        admin:
            condition: service_healthy
    healthcheck:
        <<: *nestjs-healthcheck
        test:
            [
                'CMD',
                'wget',
                '-q',
                '--spider',
                'http://localhost:3000/health/ready',
            ]
    mem_limit: 256m
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
        edge: {}
        internal:
            aliases:
                - gateway

services:
    gateway-a:
        <<: *gateway
        container_name: examio-gateway-a

    gateway-b:
        <<: *gateway
        container_name: examio-gateway-b
