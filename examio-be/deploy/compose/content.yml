# Content service (author and self-study: quiz sets, flashcards, practice, AI generation jobs):
# API + gRPC ContentService + worker, and its schema migration.
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    content:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: content-service
                ENABLE_OCR: 'false'
        container_name: examio-content
        environment:
            - NODE_ENV=production
            - PORT=3000
            - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
            - DATABASE_URL=postgresql://content_svc:${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=content
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            # Publishes content.* (generation requests, quiz set deletions) through the outbox;
            # consumes content.events (ai.generation.*, auth.user.updated, document.deleted)
            - RABBITMQ_URL=amqp://content:${RABBITMQ_CONTENT_PASS:?RABBITMQ_CONTENT_PASS is required}@rabbitmq:5672
            # api + the worker (outbox relay, generation reaper / refund sweeper / watchdog,
            # r2_delete_tasks) in this container
            - ROLE=api,worker
            # ContentService for assessment-service (the caller's forwarded user token)
            - GRPC_PORT=50051
            # finance Debit / Refund; document uploads and ownership; r2 UploadFile + DeleteObjects
            # as svc:content; vocabulary word families (to-flashcard bridge); auth public profiles;
            # ai-service ListModels
            - FINANCE_GRPC_URL=finance:50051
            - DOCUMENT_GRPC_URL=document:50051
            - R2_GRPC_URL=r2:50051
            - VOCABULARY_GRPC_URL=vocabulary:50051
            - AUTH_GRPC_URL=auth:50051
            - AI_GRPC_URL=ai:50051
            # Public base of R2 objects: tells an R2-hosted image from an external URL
            - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
            # Free AI generation: ignored in production
            - AI_FREE_MODE=${AI_FREE_MODE:-false}
            - GENERATION_JOB_TIMEOUT_MINUTES=${GENERATION_JOB_TIMEOUT_MINUTES:-60}
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
            - AUTH_TOKEN_URL=http://auth:3000/internal/token
            - SERVICE_CLIENT_SECRET=${CONTENT_SERVICE_CLIENT_SECRET:?CONTENT_SERVICE_CLIENT_SECRET is required}
        env_file:
            - .env
        depends_on:
            content-migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            r2:
                condition: service_healthy
            finance:
                condition: service_healthy
            # No dependency on vocabulary, document, auth-grpc or ai: lazy gRPC clients
            # (a request that needs one answers 503 while it is down).
        # egress: flashcard study/with-code verify a Turnstile token with Cloudflare.
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # One-shot: `prisma migrate deploy` for the content schema as content_svc, then exits.
    content-migrate:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.migration
            args:
                SERVICE: content
        container_name: examio-content-migrate
        environment:
            - DATABASE_URL=postgresql://content_svc:${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=content
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal
        restart: 'no'
        logging: *default-logging
