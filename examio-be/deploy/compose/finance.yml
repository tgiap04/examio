# Finance service: API + its schema migration
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    finance:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: finance-service
        container_name: examio-finance
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_URL=postgresql://finance_svc:${FINANCE_DB_PASSWORD:?FINANCE_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=finance
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - GRPC_PORT=50051
            - RABBITMQ_URL=amqp://finance:${RABBITMQ_FINANCE_PASS:?RABBITMQ_FINANCE_PASS is required}@rabbitmq:5672
            - ROLE=api,worker
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
            - AUTH_TOKEN_URL=http://auth:3000/internal/token
            - SERVICE_CLIENT_SECRET=${FINANCE_SERVICE_CLIENT_SECRET:?FINANCE_SERVICE_CLIENT_SECRET is required}
            - AUTH_GRPC_URL=auth:50051
        env_file:
            - .env
        depends_on:
            finance-migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # One-shot: `prisma migrate deploy` for the finance schema as finance_svc, then exits.
    finance-migrate:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.migration
            args:
                SERVICE: finance
        container_name: examio-finance-migrate
        environment:
            - DATABASE_URL=postgresql://finance_svc:${FINANCE_DB_PASSWORD:?FINANCE_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=finance
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal
        restart: 'no'
        logging: *default-logging
