# Shared infrastructure: Postgres (per-service schemas/roles), Redis, RabbitMQ, plus the
# networks and volumes every other compose file refers to.
# Included from deploy/docker-compose.yml; paths are relative to deploy/ (project_directory).
# =============================================================================
# Shared fragments (YAML anchors are per file, so each file carries its own copy)
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    # ==================== RABBITMQ ====================
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: examio-rabbitmq
        # Users + permissions come from the rendered definitions (no
        # RABBITMQ_DEFAULT_USER: importing definitions skips the default user).
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
            - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
        depends_on:
            rabbitmq-defs:
                condition: service_completed_successfully
        networks:
            - internal
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        logging: *default-logging

    # Renders definitions.template.json -> definitions.json (password hashes;
    # gitignored). Fails the stack early if any broker password is missing.
    # Passwords land in amqp:// URLs, so use URL-safe characters (hex/base64url).
    rabbitmq-defs:
        image: node:22-alpine
        container_name: examio-rabbitmq-defs
        working_dir: /defs
        network_mode: none
        command: ['node', 'render-definitions.cjs', '--out', '/defs/definitions.json']
        environment:
            - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER is required}
            - RABBITMQ_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS is required}
            - RABBITMQ_AUTH_PASS=${RABBITMQ_AUTH_PASS:?RABBITMQ_AUTH_PASS is required}
            - RABBITMQ_FINANCE_PASS=${RABBITMQ_FINANCE_PASS:?RABBITMQ_FINANCE_PASS is required}
            - RABBITMQ_EXAM_PASS=${RABBITMQ_EXAM_PASS:?RABBITMQ_EXAM_PASS is required}
            - RABBITMQ_AI_PASS=${RABBITMQ_AI_PASS:?RABBITMQ_AI_PASS is required}
            - RABBITMQ_GATEWAY_PASS=${RABBITMQ_GATEWAY_PASS:?RABBITMQ_GATEWAY_PASS is required}
        volumes:
            - ./rabbitmq:/defs
        restart: 'no'
        logging: *default-logging

    # ==================== POSTGRESQL ====================
    postgres:
        image: pgvector/pgvector:pg16
        container_name: examio-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
            - PGDATA=/var/lib/postgresql/data/pgdata
            # One password per service role; deploy/postgres/init/01-service-schemas.sh
            # creates <svc>_svc + schema <svc> from these (empty data directory only).
            - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
            - FINANCE_DB_PASSWORD=${FINANCE_DB_PASSWORD:?FINANCE_DB_PASSWORD is required}
            - ADMIN_DB_PASSWORD=${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD is required}
            - EXAM_DB_PASSWORD=${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}
            - CONTENT_DB_PASSWORD=${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD is required}
            - ASSESSMENT_DB_PASSWORD=${ASSESSMENT_DB_PASSWORD:?ASSESSMENT_DB_PASSWORD is required}
            - STUDYROOM_DB_PASSWORD=${STUDYROOM_DB_PASSWORD:?STUDYROOM_DB_PASSWORD is required}
            - VOCABULARY_DB_PASSWORD=${VOCABULARY_DB_PASSWORD:?VOCABULARY_DB_PASSWORD is required}
            - AICHAT_DB_PASSWORD=${AICHAT_DB_PASSWORD:?AICHAT_DB_PASSWORD is required}
            - DOCUMENT_DB_PASSWORD=${DOCUMENT_DB_PASSWORD:?DOCUMENT_DB_PASSWORD is required}
            - AI_DB_PASSWORD=${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
        # Each role's CONNECTION LIMIT 40 (postgres/init/01-service-schemas.sh) is a per-role ceiling,
        # not a reservation: 11 x 40 = 440 would exceed 200 if every role maxed out. The real budget is
        # the sum of the services' configured pools (Prisma connection_limit, relay pools of 2, ai-service
        # asyncpg pools capped by AI_DB_POOL_MAX_*, 28 by default) plus 3 superuser-reserved slots; keep
        # that sum under 200. The default 100 is too low for it.
        command: ['postgres', '-c', 'max_connections=200']
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres/init:/docker-entrypoint-initdb.d:ro
        networks:
            - internal
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        logging: *default-logging

    # ==================== REDIS ====================
    redis:
        image: redis:7-alpine
        container_name: examio-redis
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        volumes:
            - redis_data:/data
        networks:
            - internal
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        logging: *default-logging

# Network segmentation (RT-2):
#   edge     gateway + the FE nginx only (the only way in)
#   internal no route out: every service, Postgres, Redis, RabbitMQ
#   egress   services that really call the internet: auth (Google OAuth, SMTP),
#            exam (Turnstile), finance (SePay), r2 (Cloudflare R2), ai (Gemini)
# Data stores publish no host ports. Ops reach Postgres with
#   docker compose exec postgres psql -U <svc>_svc -d $POSTGRES_DB   (e.g. auth_svc)
# The superuser ($POSTGRES_USER) is for ops/break-glass only; no service uses it.
networks:
    edge:
        name: examio-edge
        driver: bridge
    internal:
        name: examio-internal
        driver: bridge
        internal: true
    egress:
        name: examio-egress
        driver: bridge

volumes:
    rabbitmq_data:
    postgres_data:
    redis_data:
