# Examio Microservices Production Docker Compose
# =============================================================================
# Usage:
#   1. Copy this file to docker-compose.yml at project root on your VPS
#   2. Create .env file with required environment variables (see .env.example)
#   3. docker compose build && docker compose up -d
#
# This configuration includes:
#   - PostgreSQL database (containerized)
#   - Redis cache (containerized)
#   - RabbitMQ message queue (containerized)
#   - All microservices (gateway, auth, exam, finance, r2, ai)
#   - Note: OCR is integrated into AI service (Python)
# =============================================================================

# Shared logging configuration
x-logging: &default-logging
    driver: 'json-file'
    options:
        max-size: '10m'
        max-file: '3'

# Shared healthcheck for NestJS services
x-nestjs-healthcheck: &nestjs-healthcheck
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
    # ==================== GATEWAY ====================
    gateway:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: gateway-service
        container_name: examio-gateway
        ports:
            - '127.0.0.1:6369:3000'
        environment:
            - NODE_ENV=production
            - PORT=3000
            - FRONTEND_URL=${FRONTEND_URL}
            - AUTH_SERVICE_URL=http://auth:3000
            - EXAM_SERVICE_URL=http://exam:3000
            - FINANCE_SERVICE_URL=http://finance:3000
            - ADMIN_SERVICE_URL=http://admin:3000
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            # GatewayControl gRPC server (auth/admin -> gateway), internal network only
            - GRPC_PORT=50051
            # Durable `auth.user.authz_changed` consumer (queue gateway.events)
            - RABBITMQ_URL=amqp://gateway:${RABBITMQ_GATEWAY_PASS:?RABBITMQ_GATEWAY_PASS is required}@rabbitmq:5672
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
        env_file:
            - .env
        # The gateway is a router: no database, so no postgres/migration dependency.
        depends_on:
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            auth:
                condition: service_healthy
            exam:
                condition: service_healthy
            finance:
                condition: service_healthy
            admin:
                condition: service_healthy
        networks:
            - edge
            - internal
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # ==================== AUTH SERVICE ====================
    auth:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: auth-service
        container_name: examio-auth
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - GRPC_PORT=50051
            - RABBITMQ_URL=amqp://auth:${RABBITMQ_AUTH_PASS:?RABBITMQ_AUTH_PASS is required}@rabbitmq:5672
            - ROLE=api,worker
            - R2_GRPC_URL=r2:50051
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required (scripts/gen-jwt-keypair.sh)}
            - JWT_KID=${JWT_KID:?JWT_KID is required}
            - JWT_RETIRED_PUBLIC_KEYS=${JWT_RETIRED_PUBLIC_KEYS:-}
            - SERVICE_CLIENTS=${SERVICE_CLIENTS:?SERVICE_CLIENTS is required (scripts/gen-service-secret.sh)}
            # Fast-path revoke / invalidate calls into the gateway (phase 05)
            - GATEWAY_CONTROL_ENABLED=${GATEWAY_CONTROL_ENABLED:-true}
            - GATEWAY_GRPC_URL=gateway:50051
            # Boot-time admin bootstrap (moved from admin-service in phase 04)
            - ADMIN_EMAILS=${ADMIN_EMAILS}
            - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
        env_file:
            - .env
        depends_on:
            migration:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            finance:
                condition: service_healthy
            r2:
                condition: service_healthy
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # ==================== EXAM SERVICE ====================
    exam:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: exam-service
                ENABLE_OCR: 'false'
        container_name: examio-exam
        environment:
            - NODE_ENV=production
            - PORT=3000
            - AI_SERVICE_URL=http://ai:3000/api
            - R2_SERVICE_URL=r2:3000
            - RABBITMQ_URL=amqp://exam:${RABBITMQ_EXAM_PASS:?RABBITMQ_EXAM_PASS is required}@rabbitmq:5672
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - R2_GRPC_URL=r2:50051
            - FINANCE_GRPC_URL=finance:50051
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
            - AUTH_TOKEN_URL=http://auth:3000/internal/token
            - SERVICE_CLIENT_SECRET=${EXAM_SERVICE_CLIENT_SECRET:?EXAM_SERVICE_CLIENT_SECRET is required}
        env_file:
            - .env
        depends_on:
            migration:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            r2:
                condition: service_healthy
            finance:
                condition: service_healthy
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # ==================== FINANCE SERVICE ====================
    finance:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: finance-service
        container_name: examio-finance
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - GRPC_PORT=50051
            - RABBITMQ_URL=amqp://finance:${RABBITMQ_FINANCE_PASS:?RABBITMQ_FINANCE_PASS is required}@rabbitmq:5672
            - ROLE=api,worker
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
            - AUTH_TOKEN_URL=http://auth:3000/internal/token
            - SERVICE_CLIENT_SECRET=${FINANCE_SERVICE_CLIENT_SECRET:?FINANCE_SERVICE_CLIENT_SECRET is required}
            - AUTH_GRPC_URL=auth:50051
        env_file:
            - .env
        depends_on:
            migration:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # ==================== ADMIN SERVICE ====================
    admin:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: admin-service
        container_name: examio-admin
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - ADMIN_SERVICE_URL=http://admin:3000
            - THROTTLE_ADMIN_LIMIT=30
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
            - AUTH_TOKEN_URL=http://auth:3000/internal/token
            - SERVICE_CLIENT_SECRET=${ADMIN_SERVICE_CLIENT_SECRET:?ADMIN_SERVICE_CLIENT_SECRET is required}
            # Admin privilege changes go through auth SetSystemAdmin (caller's token forwarded)
            - AUTH_GRPC_URL=auth:50051
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            auth:
                condition: service_healthy
        networks:
            - internal
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # ==================== R2 SERVICE (gRPC) ====================
    r2:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                SERVICE_NAME: r2-service
        container_name: examio-r2
        environment:
            - NODE_ENV=production
            - PORT=3000
            - GRPC_PORT=50051
            - JWT_ISSUER=${JWT_ISSUER:-examio-auth}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-examio}
            - AUTH_JWKS_URL=http://auth:3000/.well-known/jwks.json
        env_file:
            - .env
        depends_on:
            migration:
                condition: service_completed_successfully
        networks:
            - internal
            - egress
        healthcheck:
            <<: *nestjs-healthcheck
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://localhost:3000/health/ready',
                ]
        restart: unless-stopped
        logging: *default-logging

    # ==================== AI SERVICE (Python) ====================
    ai:
        build:
            context: ../apps/ai-service
            dockerfile: Dockerfile
        container_name: examio-ai
        environment:
            - PYTHONUNBUFFERED=1
            - PORT=3000
            - RABBITMQ_URL=amqp://ai:${RABBITMQ_AI_PASS:?RABBITMQ_AI_PASS is required}@rabbitmq:5672
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - GEMINI_API_KEYS=${GEMINI_API_KEYS}
            - GEMINI_MODEL_NAMES=${GEMINI_MODEL_NAMES}
            - AI2_BASE_URL=${AI2_BASE_URL:-https://ai2.devt.vn/v1}
            - AI2_API_KEY=${AI2_API_KEY:-}
            - AI2_GENERATION_MODEL_NAMES=${AI2_GENERATION_MODEL_NAMES:-minimax-m2.5-free,nemotron-3-super-free,trinity-large-preview-free}
            - AI2_DEFAULT_MODEL=${AI2_DEFAULT_MODEL:-minimax-m2.5-free}
            - AI2_TIMEOUT_SECONDS=${AI2_TIMEOUT_SECONDS:-3600}
            - AI2_MAX_TOKENS=${AI2_MAX_TOKENS:-4096}
            - DEFAULT_MAX_TOKENS_CAP=${DEFAULT_MAX_TOKENS_CAP:-4096}
            - TUTOR_FAST_RETRIEVAL_TIMEOUT_SECONDS=${TUTOR_FAST_RETRIEVAL_TIMEOUT_SECONDS:-0.5}
            - CHAT_HISTORY_MAX_MESSAGES=${CHAT_HISTORY_MAX_MESSAGES:-4}
            - CHAT_HISTORY_MAX_CHARS=${CHAT_HISTORY_MAX_CHARS:-1200}
            - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
            - OCR_SERVICE_URL= # Using internal Tesseract/PyPDF logic
        env_file:
            - .env
        depends_on:
            migration:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - internal
            - egress
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        restart: unless-stopped
        logging: *default-logging

    # ==================== RABBITMQ ====================
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: examio-rabbitmq
        # Users + permissions come from the rendered definitions (no
        # RABBITMQ_DEFAULT_USER: importing definitions skips the default user).
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
            - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
        depends_on:
            rabbitmq-defs:
                condition: service_completed_successfully
        networks:
            - internal
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        logging: *default-logging

    # Renders definitions.template.json -> definitions.json (password hashes;
    # gitignored). Fails the stack early if any broker password is missing.
    # Passwords land in amqp:// URLs, so use URL-safe characters (hex/base64url).
    rabbitmq-defs:
        image: node:22-alpine
        container_name: examio-rabbitmq-defs
        working_dir: /defs
        network_mode: none
        command: ['node', 'render-definitions.cjs', '--out', '/defs/definitions.json']
        environment:
            - RABBITMQ_USER=${RABBITMQ_USER:?RABBITMQ_USER is required}
            - RABBITMQ_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS is required}
            - RABBITMQ_AUTH_PASS=${RABBITMQ_AUTH_PASS:?RABBITMQ_AUTH_PASS is required}
            - RABBITMQ_FINANCE_PASS=${RABBITMQ_FINANCE_PASS:?RABBITMQ_FINANCE_PASS is required}
            - RABBITMQ_EXAM_PASS=${RABBITMQ_EXAM_PASS:?RABBITMQ_EXAM_PASS is required}
            - RABBITMQ_AI_PASS=${RABBITMQ_AI_PASS:?RABBITMQ_AI_PASS is required}
            - RABBITMQ_GATEWAY_PASS=${RABBITMQ_GATEWAY_PASS:?RABBITMQ_GATEWAY_PASS is required}
        volumes:
            - ./rabbitmq:/defs
        restart: 'no'
        logging: *default-logging

    # ==================== POSTGRESQL ====================
    postgres:
        image: pgvector/pgvector:pg16
        container_name: examio-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - internal
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        logging: *default-logging

    # ==================== REDIS ====================
    redis:
        image: redis:7-alpine
        container_name: examio-redis
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        volumes:
            - redis_data:/data
        networks:
            - internal
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        logging: *default-logging

    # ==================== MIGRATION ====================
    # Runs prisma migrate deploy and exits
    migration:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.migration
        container_name: examio-migration
        environment:
            - DATABASE_URL=${DATABASE_URL}
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal
        restart: 'no'
        logging: *default-logging

    # ==================== SEED ====================
    # Runs `yarn run seed:dev` once and exits. Idempotent — safe to re-run.
    # Picks up ADMIN_DEFAULT_PASSWORD / ADMIN_EMAILS from `deploy/.env`
    # via env_file so seeded users share the same password as admins
    # created by the auth-service bootstrap.
    seed:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.seed
        container_name: examio-seed
        environment:
            - DATABASE_URL=${DATABASE_URL}
            - ADMIN_EMAILS=${ADMIN_EMAILS}
            - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
        env_file:
            - .env
        depends_on:
            migration:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        networks:
            - internal
        restart: 'no'
        logging: *default-logging

# Network segmentation (RT-2):
#   edge     gateway + the FE nginx only (the only way in)
#   internal no route out: every service, Postgres, Redis, RabbitMQ
#   egress   services that really call the internet: auth (Google OAuth, SMTP),
#            exam (Turnstile), finance (SePay), r2 (Cloudflare R2), ai (Gemini)
# Data stores publish no host ports. Ops reach Postgres with
#   docker compose exec postgres psql -U $POSTGRES_USER $POSTGRES_DB
networks:
    edge:
        name: examio-edge
        driver: bridge
    internal:
        name: examio-internal
        driver: bridge
        internal: true
    egress:
        name: examio-egress
        driver: bridge

volumes:
    rabbitmq_data:
    postgres_data:
    redis_data:
