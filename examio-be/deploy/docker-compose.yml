# Examio microservices: production Docker Compose entry point
# =============================================================================
# Usage:
#   1. Create deploy/.env from deploy/.env.example (per-service variable lists:
#      deploy/env/<svc>.env.example)
#   2. docker compose build && docker compose up -d      (run from deploy/)
#
# The stack is split by service under deploy/compose/ and stitched together with
# `include:` (Docker Compose 2.20+). Every included file resolves relative paths
# (build contexts, volumes, env_file) against deploy/ via `project_directory`, so
# moving a service into its own file changed no path. Networks, volumes, Postgres,
# Redis and RabbitMQ live in compose/infra.yml. Each database-owning service has
# a `<svc>-migrate` one-shot that its API waits for (service_completed_successfully).
# Phases 12-15 add a file and one line below.
# =============================================================================
include:
    - path: compose/infra.yml
      project_directory: .
    - path: compose/auth.yml
      project_directory: .
    - path: compose/finance.yml
      project_directory: .
    - path: compose/admin.yml
      project_directory: .
    - path: compose/exam.yml
      project_directory: .
    - path: compose/gateway.yml
      project_directory: .
    - path: compose/r2.yml
      project_directory: .
    - path: compose/ai.yml
      project_directory: .
    - path: compose/seed.yml
      project_directory: .
