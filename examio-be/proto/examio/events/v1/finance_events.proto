syntax = "proto3";

package examio.events.v1;

// Payload (`data`) of `finance.subscription.changed`, published through the
// outbox in the transaction that changes the tier. A state event: `version` is
// the subscription `updatedAt` in epoch milliseconds. Times are `double` so
// they stay JSON numbers (the envelope requires a numeric `version`).
message SubscriptionChanged {
  string user_id = 1;
  int32 from_tier = 2;
  int32 to_tier = 3;
  // Epoch milliseconds of the change.
  double at = 4;
  double version = 5;
}
