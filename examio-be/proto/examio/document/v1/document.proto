syntax = "proto3";

package examio.document.v1;

// Uploaded-file metadata, upload counts and processing status
// (schema `document`). User-scoped: the actor is the `sub` of the forwarded
// user token and every RPC only sees that user's rows. A row that exists but
// belongs to someone else is indistinguishable from a missing one (NOT_FOUND /
// listed in not_found_ids), never PERMISSION_DENIED.
service DocumentService {
  // Stores the file in R2 and inserts the row PENDING with its `document.uploaded`
  // event (one transaction). No charge and no quota. Errors: INVALID_ARGUMENT for
  // an empty or oversized file, UNAVAILABLE when storage cannot be reached.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  // Caller-owned rows only; ids that are missing or foreign are simply absent
  // from the response (one query for any number of ids).
  rpc GetDocumentsByIds(GetDocumentsByIdsRequest) returns (GetDocumentsByIdsResponse);
  // NOT_FOUND if ANY of the ids is not owned by the caller.
  rpc AssertOwnership(AssertOwnershipRequest) returns (AssertOwnershipResponse);
  // Upload counts of the caller (dashboard stats). There is no monthly limit.
  rpc GetQuota(GetQuotaRequest) returns (GetQuotaResponse);
  // Re-emits `document.uploaded` when the row is FAILED or was never
  // processed (PENDING); a PROCESSING / COMPLETED row is returned unchanged.
  // NOT_FOUND when the id is not owned by the caller.
  rpc EnsureProcessed(EnsureProcessedRequest) returns (EnsureProcessedResponse);
  // Owner-scoped, idempotent delete. One transaction removes the rows, enqueues
  // the R2 keys for deletion and writes the `document.deleted` outbox row.
  // Ids that are gone or not owned are reported in not_found_ids.
  rpc DeleteDocuments(DeleteDocumentsRequest) returns (DeleteDocumentsResponse);
  // The caller's own documents, newest first, one page at a time (the data
  // behind `GET /ai/recent-uploads`; content adds its generated-history summaries).
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  // A 1 h presigned GET for the caller's own document (the generation path
  // hands it to ai-service so it can OCR a document that has no chunks yet).
  // Read-only. NOT_FOUND when the id is not owned by the caller.
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
}

// Mirrors the `UserStorage.processingStatus` column
// (PENDING | PROCESSING | COMPLETED | FAILED).
enum DocumentProcessingStatus {
  // 1 was PENDING_CHARGE (row inserted, upload credit not debited yet); uploads
  // are no longer charged.
  reserved 1;
  reserved "DOCUMENT_PROCESSING_STATUS_PENDING_CHARGE";
  DOCUMENT_PROCESSING_STATUS_UNSPECIFIED = 0;
  // Accepted, waiting for ai-service (or not yet processed: quick-upload).
  DOCUMENT_PROCESSING_STATUS_PENDING = 2;
  DOCUMENT_PROCESSING_STATUS_PROCESSING = 3;
  DOCUMENT_PROCESSING_STATUS_COMPLETED = 4;
  DOCUMENT_PROCESSING_STATUS_FAILED = 5;
}

// One uploaded file (`UserStorage`).
message DocumentInfo {
  // 9 was credit_charged (the upload credit was debited); uploads are no longer charged.
  reserved 9;
  reserved "credit_charged";
  string id = 1;
  string user_id = 2;
  string filename = 3;
  string mimetype = 4;
  // Bytes.
  int64 size = 5;
  // R2 object key (unique).
  string key_r2 = 6;
  // Public/stored URL as kept in `UserStorage.url`.
  string url = 7;
  DocumentProcessingStatus processing_status = 8;
  // Pages found by OCR, from `ai.document.processed`; 0 while unknown.
  int32 page_count = 10;
  // Unix epoch milliseconds.
  int64 created_at = 11;
  int64 updated_at = 12;
}

message CreateUploadRequest {
  // 4 was charge_credits (debit the upload credit); uploads are no longer charged.
  reserved 4;
  reserved "charge_credits";
  string filename = 1;
  string mimetype = 2;
  bytes data = 3;
  // true: when the caller already has an upload with the same (filename, size),
  // return it instead of storing again (generateFromFile reuse branch).
  bool reuse_duplicate = 5;
}

message CreateUploadResponse {
  DocumentInfo document = 1;
  // True when `document` is an existing duplicate and nothing was stored.
  bool reused = 2;
}

message GetDocumentsByIdsRequest {
  repeated string ids = 1;
}

message GetDocumentsByIdsResponse {
  repeated DocumentInfo documents = 1;
}

message AssertOwnershipRequest {
  repeated string ids = 1;
}

message AssertOwnershipResponse {}

message GetQuotaRequest {}

message GetQuotaResponse {
  // 2 was monthly_limit (the subscription's files per month); there is no limit.
  reserved 2;
  reserved "monthly_limit";
  // Uploads created since the start of the current calendar month.
  int32 used_this_month = 1;
  // All-time number of files the user has (the dashboard "total PDFs" stat).
  int32 file_count = 3;
}

message EnsureProcessedRequest {
  string id = 1;
}

message EnsureProcessedResponse {
  DocumentInfo document = 1;
}

message DeleteDocumentsRequest {
  repeated string ids = 1;
}

message DeletedDocument {
  string id = 1;
  string filename = 2;
}

message DeleteDocumentsResponse {
  repeated DeletedDocument deleted = 1;
  repeated string not_found_ids = 2;
}

message ListDocumentsRequest {
  // 1-based page number; 0 is treated as 1.
  int32 page = 1;
  // Page size, 1..100; 0 is treated as 10.
  int32 size = 2;
}

message ListDocumentsResponse {
  repeated DocumentInfo documents = 1;
}

message GetDownloadUrlRequest {
  string id = 1;
}

message GetDownloadUrlResponse {
  string download_url = 1;
  // Unix epoch milliseconds.
  int64 expires_at = 2;
}
