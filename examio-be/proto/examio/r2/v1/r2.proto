syntax = "proto3";

package examio.r2.v1;

// File storage on Cloudflare R2.
service R2Service {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  // Signed URL for a stored object.
  rpc GetFileUrl(GetFileUrlRequest) returns (GetFileUrlResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ListUserFiles(ListUserFilesRequest) returns (ListUserFilesResponse);
  // Idempotent batch delete: keys that no longer exist count as success.
  rpc DeleteObjects(DeleteObjectsRequest) returns (DeleteObjectsResponse);
  // Presigned GET URL for a key, valid for expires_in_seconds (service callers;
  // used by document-service to hand ai-service a download URL).
  rpc CreatePresignedDownload(CreatePresignedDownloadRequest) returns (CreatePresignedDownloadResponse);
}

message UploadFileRequest {
  string user_id = 1;
  string filename = 2;
  string mimetype = 3;
  bytes content = 4;
  // Optional folder path.
  string folder = 5;
}

message UploadFileResponse {
  bool success = 1;
  string file_id = 2;
  string url = 3;
  string key_r2 = 4;
  string message = 5;
}

message GetFileUrlRequest {
  string key_r2 = 1;
  int32 expires_in_seconds = 2;
}

message GetFileUrlResponse {
  string url = 1;
  int64 expires_at = 2;
}

message DeleteFileRequest {
  string key_r2 = 1;
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

message ListUserFilesRequest {
  string user_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message FileInfo {
  string file_id = 1;
  string filename = 2;
  string url = 3;
  string mimetype = 4;
  int64 size = 5;
  int64 created_at = 6;
}

message ListUserFilesResponse {
  repeated FileInfo files = 1;
  int32 total = 2;
  int32 page = 3;
  int32 size = 4;
}

message DeleteObjectsRequest {
  repeated string keys = 1;
}

message DeleteObjectsResponse {
  int32 deleted_count = 1;
  // Keys R2 refused to delete (e.g. AccessDenied); retry only these. Keys that
  // no longer exist are NOT listed: they count as deleted.
  repeated string failed_keys = 2;
}

message CreatePresignedDownloadRequest {
  string key = 1;
  // Validity of the URL; the server clamps it to its configured maximum.
  int32 expires_in_seconds = 2;
}

message CreatePresignedDownloadResponse {
  string url = 1;
  // Unix epoch milliseconds when the URL stops working.
  int64 expires_at = 2;
}
