syntax = "proto3";

package examio.finance.v1;

service WalletService {
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);

  // Idempotent money movement. A repeated idempotency_key returns the original
  // transaction with already_applied = true. Server lands in phase 10.
  rpc Debit(DebitRequest) returns (DebitResponse);
  rpc Credit(CreditRequest) returns (CreditResponse);
  // Reverses the debit identified by debit_idempotency_key (at most once).
  rpc Refund(RefundRequest) returns (RefundResponse);

  // Replaced by Debit/Credit in phase 10, then deleted.
  rpc UpdateBalance(UpdateBalanceRequest) returns (UpdateBalanceResponse) {
    option deprecated = true;
  }
}

message CreateWalletRequest {
  string user_id = 1;
  int32 initial_balance = 2;
}

message CreateWalletResponse {
  bool success = 1;
  string wallet_id = 2;
  string message = 3;
}

message GetWalletRequest {
  string user_id = 1;
}

message GetWalletResponse {
  string wallet_id = 1;
  string user_id = 2;
  int32 balance = 3;
}

// Credits are whole numbers (Postgres Int columns), so every money field is int32.
message WalletTransaction {
  string id = 1;
  string wallet_id = 2;
  int32 amount = 3;
  // ADD | SUBTRACT
  string direction = 4;
  string reason = 5;
  string idempotency_key = 6;
  int32 balance_after = 7;
  // Unix epoch milliseconds.
  int64 created_at = 8;
}

message DebitRequest {
  string user_id = 1;
  int32 amount = 2;
  string reason = 3;
  string idempotency_key = 4;
}

message DebitResponse {
  WalletTransaction transaction = 1;
  bool already_applied = 2;
}

message CreditRequest {
  string user_id = 1;
  int32 amount = 2;
  string reason = 3;
  string idempotency_key = 4;
}

message CreditResponse {
  WalletTransaction transaction = 1;
  bool already_applied = 2;
}

message RefundRequest {
  string debit_idempotency_key = 1;
  string reason = 2;
}

message RefundResponse {
  WalletTransaction transaction = 1;
  bool already_applied = 2;
}

message UpdateBalanceRequest {
  string user_id = 1;
  int32 amount = 2;
  // ADD | SUBTRACT
  string transaction_type = 3;
  string description = 4;
}

message UpdateBalanceResponse {
  bool success = 1;
  int32 new_balance = 2;
  string message = 3;
}
