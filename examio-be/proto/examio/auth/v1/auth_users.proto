syntax = "proto3";

package examio.auth.v1;

import "examio/auth/v1/auth.proto";

// Phase 10 user operations that were SQL in other services. Served by
// auth-service (same process and guards as AuthService). The acting user is
// always the subject of the forwarded token.
service AuthUserService {
  // Admin edit of profile fields (`user:manage`). Publishes auth.user.updated
  // in the same transaction.
  rpc UpdateUserAdmin(UpdateUserAdminRequest) returns (UpdateUserAdminResponse);
  // Display-safe user search (no email). Result capped at 20.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  // Aggregates for the admin overview (`stats:read`).
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
  // Admin user detail: the account plus its latest session (`user:manage`).
  rpc GetUserAdminDetail(GetUserAdminDetailRequest) returns (GetUserAdminDetailResponse);
}

message GetUserAdminDetailRequest {
  string user_id = 1;
}

message LastSession {
  string id = 1;
  optional string device_name = 2;
  optional string browser = 3;
  optional string os = 4;
  optional string ip_address = 5;
  optional string country = 6;
  optional string city = 7;
  // Unix epoch milliseconds.
  int64 last_activity = 8;
  bool is_active = 9;
}

message GetUserAdminDetailResponse {
  User user = 1;
  optional LastSession last_session = 2;
}

message UpdateUserAdminRequest {
  string user_id = 1;
  optional string name = 2;
  optional string bio = 3;
  optional bool is_verified = 4;
}

message UpdateUserAdminResponse {
  User user = 1;
}

message SearchUsersRequest {
  string query = 1;
  // 1..20, default 20.
  int32 limit = 2;
}

message SearchUsersResponse {
  repeated PublicProfile profiles = 1;
}

message GetUserStatsRequest {
  // Series window in days (1..365); 0 = 30.
  int32 days = 1;
  // Window of the utm breakdown in days; unset = all time. Only computed
  // when include_utm_sources is true.
  optional int32 utm_days = 2;
  bool include_utm_sources = 3;
}

message DatePoint {
  // YYYY-MM-DD (UTC).
  string date = 1;
  int64 value = 2;
}

message UtmBreakdown {
  string source = 1;
  int64 count = 2;
}

message GetUserStatsResponse {
  int64 total_users = 1;
  int64 active_today = 2;
  int64 active_last30d = 3;
  repeated DatePoint signups_series = 4;
  repeated DatePoint traffic_series = 5;
  repeated UtmBreakdown utm_sources = 6;
}
