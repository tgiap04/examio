syntax = "proto3";

package examio.auth.v1;

import "examio/common/v1/pagination.proto";

// Identity and authorization data owned by auth-service.
// The acting user is never carried in a request body: it is always the
// subject of the forwarded token.
service AuthService {
  // Full user record (privileged: includes email).
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Batch lookup (privileged: includes email). Result keeps input order,
  // unknown ids are omitted.
  rpc GetUsersByIds(GetUsersByIdsRequest) returns (GetUsersByIdsResponse);
  // Display-safe projection (no email). The only projection that may be cached.
  rpc GetPublicProfilesByIds(GetPublicProfilesByIdsRequest) returns (GetPublicProfilesByIdsResponse);
  rpc FindUserByEmail(FindUserByEmailRequest) returns (FindUserByEmailResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse);
  rpc SetSystemAdmin(SetSystemAdminRequest) returns (SetSystemAdminResponse);
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
  rpc ListRoleChanges(ListRoleChangesRequest) returns (ListRoleChangesResponse);
}

enum BaseRole {
  BASE_ROLE_UNSPECIFIED = 0;
  BASE_ROLE_STUDENT = 1;
  BASE_ROLE_TEACHER = 2;
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string name = 4;
  string avatar = 5;
  BaseRole role = 6;
  bool is_system_admin = 7;
  bool is_verified = 8;
  bool is_banned = 9;
  // Unix epoch milliseconds.
  int64 created_at = 10;
}

message PublicProfile {
  string id = 1;
  string username = 2;
  string name = 3;
  string avatar = 4;
}

message RoleChange {
  string id = 1;
  string target_user_id = 2;
  // User that performed the change (taken from the token, never from a request).
  string changed_by = 3;
  BaseRole from_role = 4;
  BaseRole to_role = 5;
  bool from_is_system_admin = 6;
  bool to_is_system_admin = 7;
  string reason = 8;
  // Unix epoch milliseconds.
  int64 created_at = 9;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersByIdsRequest {
  repeated string user_ids = 1;
}

message GetUsersByIdsResponse {
  repeated User users = 1;
}

message GetPublicProfilesByIdsRequest {
  repeated string user_ids = 1;
}

message GetPublicProfilesByIdsResponse {
  repeated PublicProfile profiles = 1;
}

message FindUserByEmailRequest {
  string email = 1;
}

message FindUserByEmailResponse {
  User user = 1;
}

message ListUsersRequest {
  string query = 1;
  optional BaseRole role = 2;
  optional bool is_system_admin = 3;
  optional bool is_banned = 4;
  int32 page = 5;
  int32 limit = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  examio.common.v1.PageMeta page = 2;
}

message SetUserRoleRequest {
  string user_id = 1;
  BaseRole role = 2;
  string reason = 3;
}

message SetUserRoleResponse {
  User user = 1;
}

message SetSystemAdminRequest {
  string user_id = 1;
  bool is_system_admin = 2;
  string reason = 3;
}

message SetSystemAdminResponse {
  User user = 1;
}

message SetUserStatusRequest {
  string user_id = 1;
  bool is_banned = 2;
  string reason = 3;
}

message SetUserStatusResponse {
  User user = 1;
}

message ListRoleChangesRequest {
  optional string target_user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListRoleChangesResponse {
  repeated RoleChange changes = 1;
  examio.common.v1.PageMeta page = 2;
}
