version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  ignore_only:
    # Contract name fixed by the architecture (examio.gateway.v1.GatewayControl).
    SERVICE_SUFFIX:
      - examio/gateway/v1/gateway_control.proto
    # The phase 14 contract returns the domain messages themselves (QuizSetSnapshot,
    # UserContentStats) instead of one-field wrappers, exactly as the plan specifies.
    RPC_RESPONSE_STANDARD_NAME:
      - examio/content/v1/content.proto
breaking:
  use:
    - FILE
  ignore_only:
    # Remove-finance change: finance-service and its contracts are deleted
    # (wallet, subscription, finance_admin and the finance events). buf's FILE
    # category flags a deleted file. Remove these entries once the change is
    # merged so any later file deletion is flagged again.
    FILE_NO_DELETE:
      - examio/finance
      - examio/events/v1/finance_events.proto
    # Remove-finance change: document.proto reserves the dropped money fields
    # (credit_charged, charge_credits, monthly_limit) and the PENDING_CHARGE
    # enum value. buf's FILE category flags a deletion even when it is reserved.
    # Remove these entries once the change is merged so any later deletion in
    # document.proto is flagged again.
    FIELD_NO_DELETE:
      - examio/document/v1/document.proto
    ENUM_VALUE_NO_DELETE:
      - examio/document/v1/document.proto
