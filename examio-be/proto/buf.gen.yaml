version: v2
clean: true
plugins:
  - local: ../node_modules/.bin/protoc-gen-ts_proto
    out: ../libs/contracts/src/generated
    strategy: all
    opt:
      - nestJs=true
      - addGrpcMetadata=true
      - addNestjsRestParameter=true
      - esModuleInterop=true
      - env=node
      - forceLong=string
